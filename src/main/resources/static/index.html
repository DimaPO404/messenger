<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер</title>
    <link rel="stylesheet" href="style.css">
    <!-- Библиотеки для WebSocket -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>

<div class="container">
    <!-- Экран регистрации/входа -->
    <div id="auth-view" class="view active">
        <h2>Регистрация</h2>
        <form id="register-form">
            <input type="text" id="reg-name" placeholder="Отображаемое имя" required>
            <input type="text" id="reg-userId" placeholder="Уникальный ID (например, @dima)" required>
            <input type="tel" id="reg-phone" placeholder="Телефон (+7...)" required>
            <input type="password" id="reg-password" placeholder="Пароль (мин. 5 символов)" required>
            <input type="text" id="reg-description" placeholder="О себе (необязательно)">
            <button type="submit">Создать аккаунт</button>
        </form>
        <p id="auth-error" class="error-message"></p>
    </div>

    <!-- Экран чата -->
    <div id="chat-view" class="view">
        <div class="chat-header">
            <h2>Чат <span id="chat-id-display">#1</span></h2>
            <button id="logout-btn" class="btn-danger">Выйти</button>
        </div>

        <div id="chat-window"></div>

        <form id="message-form">
            <input type="text" id="message-input" placeholder="Напишите сообщение..." autocomplete="off">
            <button type="submit">Отправить</button>
        </form>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
