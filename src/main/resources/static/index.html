<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран авторизации (показывается, если не залогинен) -->
<div id="auth-screen" class="auth-container">
    <div class="auth-box">
        <h2>Добро пожаловать</h2>
        <div class="auth-tabs">
            <button id="tab-login" class="tab-btn active">Вход</button>
            <button id="tab-register" class="tab-btn">Регистрация</button>
        </div>

        <form id="login-form" class="auth-form active">
            <input type="text" id="login-userId" placeholder="@username" required>
            <div class="error-text">Неверный формат ID</div>
            <input type="password" id="login-password" placeholder="Пароль" required>
            <div class="error-text">Пароль обязателен</div>
            <button type="submit" class="btn-primary">Войти</button>
            <div id="auth-error-global" class="global-error"></div>
        </form>

        <form id="register-form" class="auth-form">
            <input type="text" id="reg-name" placeholder="Имя" required>
            <div class="error-text">Имя не может быть пустым</div>
            <input type="text" id="reg-userId" placeholder="@username" required>
            <div class="error-text">Только @, буквы, цифры и _ (1-30 симв.)</div>
            <input type="tel" id="reg-phone" placeholder="+7..." required>
            <div class="error-text">Неверный формат телефона</div>
            <input type="password" id="reg-password" placeholder="Пароль (мин. 5 символов)" required>
            <div class="error-text">Минимум 5 символов</div>
            <input type="text" id="reg-description" placeholder="О себе (необязательно)">
            <button type="submit" class="btn-primary">Создать аккаунт</button>
            <div id="auth-error-global-reg" class="global-error"></div>
        </form>
    </div>
</div>

<!-- Основной интерфейс мессенджера -->
<div id="app-screen" class="app-container hidden">
    <!-- Левая колонка: Сайдбар -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="current-user-info">
                <div class="avatar-small" id="sidebar-avatar"></div>
                <div class="user-details">
                    <span class="user-name" id="sidebar-name">Имя</span>
                    <span class="user-id" id="sidebar-userId">@id</span>
                </div>
            </div>
            <button id="logout-btn" class="btn-icon" title="Выйти">🚪</button>
        </div>

        <div class="search-container">
            <input type="text" id="user-search" placeholder="🔍 Поиск по @username...">
            <div id="search-results" class="search-results hidden"></div>
        </div>

        <div class="sidebar-actions">
            <button id="btn-new-personal" class="btn-secondary">+ Личный чат</button>
            <button id="btn-new-group" class="btn-secondary">+ Группа</button>
        </div>

        <div class="chat-list" id="chat-list">
            <!-- Сюда JS будет добавлять чаты -->
            <div class="empty-state">Загрузка чатов...</div>
        </div
    </aside>

    <!-- Правая колонка: Активный чат -->
    <main class="main-chat">
        <div id="no-chat-selected" class="no-chat-state">
            <div class="no-chat-icon">💬</div>
            <h3>Выберите чат или создайте новый</h3>
        </div>

        <div id="active-chat-view" class="hidden">
            <header class="chat-header">
                <div class="chat-info">
                    <h3 id="chat-title">Название чата</h3>
                    <span id="chat-status" class="chat-status">онлайн</span>
                </div>
            </header>

            <div id="chat-window" class="chat-window"></div>

            <form id="message-form" class="message-form">
                <input type="text" id="message-input" placeholder="Написать сообщение..." autocomplete="off">
                <button type="submit" class="btn-send">➤</button>
            </form>
        </div>
    </main>
</div>

<!-- Модальное окно профиля -->
<div id="profile-modal" class="modal hidden">
    <div class="modal-content">
        <span class="close-modal" id="close-profile-modal">&times;</span>
        <div class="profile-header">
            <img src="" alt="Avatar" class="profile-avatar" id="profile-avatar">
            <h2 id="profile-name" class="profile-name"></h2>
        </div>
        <div class="profile-info">
            <div class="info-row"><span class="info-label">ID:</span><span class="info-value" id="profile-userId"></span></div>
            <div class="info-row"><span class="info-label">Телефон:</span><span class="info-value" id="profile-phone"></span></div>
            <div class="info-row"><span class="info-label">О себе:</span><span class="info-value" id="profile-description"></span></div>
        </div>
    </div>
</div>

<script src="app.js?v=4"></script>
</body>
</html>
