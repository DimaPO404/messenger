spring.application.name=messenger_pet_project

spring.datasource.url = jdbc:postgresql://localhost:5432/messenger_db
spring.datasource.username = postgres
spring.datasource.password = postgres
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true

logging.level.root=INFO

logging.level.io.github.DimaPO404.messenger_pet_project=DEBUG

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.file.name=logs/messenger.log